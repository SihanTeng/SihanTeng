name: Update Literature Quote

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch random literature quote
        run: |
          RESPONSE=$(curl -s "https://api.quotable.kurokeita.dev/api/quotes/random")
          CONTENT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['quote']['content'][:150])")
          AUTHOR=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['quote']['author']['name'])")

          ENCODED_QUOTE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''${CONTENT}'''))")
          ENCODED_AUTHOR=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''${AUTHOR}'''))")

          NEW_URL="https://quotes-github-readme.vercel.app/api?type=horizontal\&theme=tokyonight\&quote=${ENCODED_QUOTE}\&author=${ENCODED_AUTHOR}"

          # Replace the quote image line in README
          sed -i "s|https://quotes-github-readme.vercel.app/api?type=horizontal&theme=tokyonight&quote=.*$|${NEW_URL}|" README.md

          echo "Updated to: ${CONTENT} — ${AUTHOR}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "📖 Update daily literature quote"
          git push
